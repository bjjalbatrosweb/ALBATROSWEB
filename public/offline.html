<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <title>Albatros · Sin conexión</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050608;color:#fff;font-family:Inter,system-ui,sans-serif;padding:24px}.card{width:min(430px,100%);border:1px solid rgba(255,255,255,.09);border-radius:32px;background:radial-gradient(circle at 50% 0,rgba(239,68,68,.14),transparent 45%),#0a0b0f;padding:34px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}img{width:76px;height:76px;object-fit:contain}.label{margin:24px 0 0;color:#ef4444;font-size:10px;font-weight:900;letter-spacing:.28em;text-transform:uppercase}h1{margin:8px 0 0;font-size:32px;font-style:italic;text-transform:uppercase;letter-spacing:-.04em}p{margin:14px auto 0;max-width:320px;color:rgba(255,255,255,.48);font-size:13px;line-height:1.6}button{margin-top:24px;border:0;border-radius:999px;background:#ef4444;color:#fff;padding:14px 24px;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon-192.png" alt="Albatros" />
      <p class="label">Modo sin conexión</p>
      <h1>Albatros</h1>
      <p>La página solicitada todavía no está guardada en este dispositivo. Conéctate una vez, abre “Clase en vivo” y después podrás volver a utilizarla sin internet.</p>
      <button type="button" onclick="location.reload()">Intentar nuevamente</button>
    </main>
  </body>
</html>
